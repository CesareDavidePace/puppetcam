[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "puppetcam"
dynamic = ["version"]  # from puppetcam.__version__, the only place to bump it
description = "An animated avatar for your video calls. Runs 100% locally on CPU, no training, no cloud."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"  # tomllib; high-res time.sleep on Windows
keywords = ["avatar", "webcam", "virtual camera", "face tracking", "mediapipe", "video calls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
# mediapipe already brings opencv-contrib-python and sounddevice:
# don't add another OpenCV wheel, two cv2 packages conflict.
dependencies = [
    "mediapipe>=0.10.14; sys_platform != 'win32'",
    # Windows 11 Smart App Control blocks the unsigned DLL that MediaPipe >= 0.10.30 loads
    # (WinError 4551); 0.10.21 loads fine. It has no wheels for Python 3.13+.
    "mediapipe>=0.10.14,<0.10.30; sys_platform == 'win32' and python_version < '3.13'",
    "mediapipe>=0.10.30; sys_platform == 'win32' and python_version >= '3.13'",
    "numpy>=1.24",
    "certifi",  # model download on python.org macOS builds, which lack system CAs
    "pyvirtualcam>=0.11",
    "appnope>=0.1.3; sys_platform == 'darwin'",
    # Menu bar / tray app (brings Pillow). On Linux it's the [tray] extra: it needs a desktop.
    "pystray>=0.19.5; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5"]
dev = ["pytest>=7", "ruff>=0.5", "imageio>=2.30"]

[project.scripts]
puppetcam = "puppetcam.cli:main"

[project.gui-scripts]
puppetcam-tray = "puppetcam.tray:main"  # no console window on Windows

[project.entry-points."puppetcam.avatars"]
sprout = "puppetcam.avatars.sprout:SproutAvatar"

[project.urls]
Homepage = "https://github.com/cesaredavidepace/puppetcam"
Issues = "https://github.com/cesaredavidepace/puppetcam/issues"

[tool.setuptools.dynamic]
version = { attr = "puppetcam.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puppetcam = ["themes/*.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
