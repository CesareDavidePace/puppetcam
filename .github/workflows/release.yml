name: Release

# Push a tag like v0.1.0 to build and publish to PyPI.
# One-time setup: on pypi.org add a "trusted publisher" for this repo,
# workflow release.yml, environment pypi. No API token needed.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        run: test "v$(grep -Po '__version__ = "\K[^"]+' src/puppetcam/__init__.py)" = "$GITHUB_REF_NAME"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
